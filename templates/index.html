
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WAREALLY CHATBOT</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="chat-container">

        <!-- HEADER -->
        <header class="chat-header">

            <div class="brand">
                <div class="brand-logo">W</div>

                <div class="brand-info">
                    <h2>WAREALLY CHATBOT</h2>
                    <p>Your AI Assistant</p>
                </div>
            </div>

            <div class="online-status">
                <span class="status-dot"></span>
                Online
            </div>

        </header>


        <!-- CHAT AREA -->
        <main class="chat-box" id="chatBox">

            <!-- WELCOME SCREEN -->
            <div class="welcome-screen" id="welcomeScreen">

                <div class="welcome-logo">W</div>

                <h1>Welcome to Wareally</h1>

                <p>
                    Your intelligent AI assistant.
                    Ask questions, learn new things
                    and explore ideas.
                </p>

            </div>

        </main>


        <!-- MESSAGE INPUT -->
        <footer class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Message Wareally..."
                autocomplete="off"
            >

            <button id="sendBtn" aria-label="Send message">
                Send
            </button>

        </footer>

    </div>


    <!-- MARKDOWN LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- MAIN JAVASCRIPT -->
    <script src="/static/script.js"></script>

</body>
</html>
